<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>手書き工事日報アプリ</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Luckysheet (エクセル画面表示用) -->
    <link rel='stylesheet' href='https://cdn.jsdelivr.net/npm/luckysheet@2.1.13/dist/plugins/css/pluginsCss.css' />
    <link rel='stylesheet' href='https://cdn.jsdelivr.net/npm/luckysheet@2.1.13/dist/plugins/plugins.css' />
    <link rel='stylesheet' href='https://cdn.jsdelivr.net/npm/luckysheet@2.1.13/dist/css/luckysheet.css' />
    <link rel='stylesheet' href='https://cdn.jsdelivr.net/npm/luckysheet@2.1.13/dist/assets/iconfont/iconfont.css' />
    <script src="https://cdn.jsdelivr.net/npm/luckysheet@2.1.13/dist/plugins/js/plugin.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/luckysheet@2.1.13/dist/luckysheet.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/luckyexcel@1.0.1/dist/luckyexcel.umd.js"></script>

    <!-- ExcelJS & FileSaver (エクセルファイル保存用) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

    <style>
        body { margin: 0; overflow: hidden; background-color: #f3f4f6; }
        #luckysheet-container { position: absolute; top: 70px; left: 0; width: 100%; height: calc(100vh - 70px); }
        #canvas-container { touch-action: none; }
    </style>
</head>
<body>

    <!-- 上部操作メニュー -->
    <div class="h-[70px] bg-white border-b flex items-center justify-between px-4 shadow-sm">
        <div class="flex items-center gap-4">
            <h1 class="text-xl font-bold text-gray-700 hidden md:block">工事日報 手書き入力</h1>
            
            <label class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded cursor-pointer transition">
                📂 1. Excelを開く
                <input type="file" id="fileInput" accept=".xlsx" class="hidden">
            </label>
            
            <button onclick="openHandwritingModal()" class="bg-green-500 hover:bg-green-600 text-white font-bold py-2 px-4 rounded transition">
                ✍️ 2. 選択セルに手書き
            </button>
        </div>
        
        <button onclick="downloadExcel()" class="bg-gray-800 hover:bg-gray-900 text-white font-bold py-2 px-4 rounded transition">
            💾 3. 保存してダウンロード
        </button>
    </div>

    <!-- エクセル表示エリア -->
    <div id="luckysheet-container"></div>

    <!-- 手書き入力モーダル (初期状態は非表示) -->
    <div id="handwritingModal" class="hidden fixed inset-0 bg-black bg-opacity-60 flex justify-center items-center z-[9999]">
        <div class="bg-white rounded-lg shadow-xl w-[95%] max-w-2xl flex flex-col overflow-hidden">
            <div class="p-4 bg-gray-100 border-b flex justify-between items-center">
                <h2 class="text-lg font-bold text-gray-700">指やペンで文字を書いてください</h2>
                <button onclick="closeModal()" class="text-gray-500 hover:text-black text-2xl font-bold">&times;</button>
            </div>
            
            <!-- キャンバス -->
            <div id="canvas-container" class="bg-white relative">
                <canvas id="drawingCanvas" class="w-full h-[400px] border-b cursor-crosshair"></canvas>
            </div>
            
            <div class="p-4 bg-gray-50 flex justify-between items-center">
                <button onclick="clearCanvas()" class="text-gray-600 bg-gray-200 hover:bg-gray-300 py-3 px-6 rounded-lg font-bold text-lg">
                    消去
                </button>
                <button id="recognizeBtn" onclick="recognizeText()" class="bg-blue-600 hover:bg-blue-700 text-white py-3 px-8 rounded-lg font-bold text-lg shadow-md">
                    AIで認識して入力
                </button>
            </div>
        </div>
    </div>

    <!-- ローディング画面 -->
    <div id="loading" class="hidden fixed inset-0 bg-white bg-opacity-80 flex justify-center items-center z-[10000]">
        <div class="text-xl font-bold text-blue-600 animate-pulse">処理中... 少々お待ちください</div>
    </div>

    <script>
        // --- 設定 ---
        const API_KEY = "AQ.Ab8RN6IB9ToE1XKqIGbP14g4IF6bFTmcLJ061v24CXYnXfhOdA";
        let originalExcelBuffer = null;
        let originalFileName = "工事日報_手書き済.xlsx";

        // --- 初期化 ---
        window.onload = () => {
            luckysheet.create({
                container: 'luckysheet-container',
                showinfobar: false,
                lang: 'ja',
                data: [{ name: "シート1" }] // 空のシート
            });
            initCanvas();
        };

        // --- 1. Excelファイル読み込み ---
        document.getElementById('fileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            
            originalFileName = file.name;
            showLoading(true);

            // ファイルをArrayBufferとして読み込み（保存用にバックアップ）
            file.arrayBuffer().then(buffer => {
                originalExcelBuffer = buffer.slice(0); // バックアップを保存

                // Luckysheetに表示
                LuckyExcel.transformExcelToLucky(file, function(exportJson, luckysheetfile) {
                    if(exportJson.sheets == null || exportJson.sheets.length == 0){
                        alert("読み込みに失敗しました。");
                        showLoading(false);
                        return;
                    }
                    luckysheet.destroy();
                    luckysheet.create({
                        container: 'luckysheet-container',
                        showinfobar: false,
                        lang: 'ja',
                        data: exportJson.sheets,
                        title: exportJson.info.name
                    });
                    showLoading(false);
                });
            }).catch(err => {
                alert("ファイルの読み込みエラー: " + err);
                showLoading(false);
            });
            
            e.target.value = ''; // リセット
        });

        // --- 2. 手書き機能 ---
        let canvas, ctx;
        let isDrawing = false;

        function initCanvas() {
            canvas = document.getElementById('drawingCanvas');
            ctx = canvas.getContext('2d');
            resizeCanvas();

            const startDrawing = (e) => {
                isDrawing = true;
                draw(e);
            };
            const stopDrawing = () => {
                isDrawing = false;
                ctx.beginPath();
            };
            const draw = (e) => {
                if (!isDrawing) return;
                e.preventDefault();
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                const x = (clientX - rect.left) * (canvas.width / rect.width);
                const y = (clientY - rect.top) * (canvas.height / rect.height);
                
                ctx.lineWidth = 5;
                ctx.lineCap = 'round';
                ctx.strokeStyle = 'black';
                
                ctx.lineTo(x, y);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(x, y);
            };

            canvas.addEventListener('mousedown', startDrawing);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseup', stopDrawing);
            canvas.addEventListener('mouseout', stopDrawing);
            
            canvas.addEventListener('touchstart', startDrawing, {passive: false});
            canvas.addEventListener('touchmove', draw, {passive: false});
            canvas.addEventListener('touchend', stopDrawing);
        }

        function resizeCanvas() {
            if(!canvas) return;
            const container = document.getElementById('canvas-container');
            canvas.width = container.clientWidth;
            canvas.height = 400; // 固定の高さ
            clearCanvas();
        }

        function clearCanvas() {
            ctx.fillStyle = "white";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.beginPath();
        }

        function openHandwritingModal() {
            const ranges = luckysheet.getRange();
            if(!ranges || ranges.length === 0) {
                alert("先に入力したい「セル」を1回タップして選択してください。");
                return;
            }
            document.getElementById('handwritingModal').classList.remove('hidden');
            setTimeout(resizeCanvas, 100);
        }

        function closeModal() {
            document.getElementById('handwritingModal').classList.add('hidden');
        }

        // --- Gemini APIで文字認識 ---
        async function recognizeText() {
            showLoading(true);
            const base64Image = canvas.toDataURL("image/jpeg").split(',')[1];
            
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [
                                { text: "以下の画像に書かれている手書きの文字を読み取り、テキストデータとして出力してください。出力はテキストのみとし、余計な説明や記号は含めないでください。何も書かれていない場合は「」と出力してください。" },
                                { inline_data: { mime_type: "image/jpeg", data: base64Image } }
                            ]
                        }]
                    })
                });
                
                const data = await response.json();
                if (data.error) throw new Error(data.error.message);
                
                let text = data.candidates[0].content.parts[0].text.trim();
                
                // 選択されているセルに入力
                if (text && text !== "「」") {
                    const range = luckysheet.getRange()[0];
                    luckysheet.setCellValue(range.row[0], range.column[0], text);
                }
                
                closeModal();
            } catch (err) {
                alert("認識エラー: " + err.message);
            } finally {
                showLoading(false);
            }
        }

        // --- 3. 完璧なエクセル書き出し (ExcelJS) ---
        async function downloadExcel() {
            if (!originalExcelBuffer) {
                alert("先にExcelファイルを読み込んでください。");
                return;
            }
            
            showLoading(true);
            try {
                const wb = new ExcelJS.Workbook();
                // ① まず「元のエクセルファイル」を読み込む（これで色や罫線がすべて保持される）
                await wb.xlsx.load(originalExcelBuffer);
                
                // ② Luckysheet上のデータを取得
                const sheets = luckysheet.getAllSheets();
                
                // ③ 元のエクセルに対して、上書きされた文字だけを反映する
                sheets.forEach(lSheet => {
                    const eSheet = wb.getWorksheet(lSheet.name);
                    if (!eSheet) return;
                    
                    if (lSheet.data) {
                        for (let r = 0; r < lSheet.data.length; r++) {
                            for (let c = 0; c < lSheet.data[r].length; c++) {
                                const lCell = lSheet.data[r][c];
                                // 値が存在し、数式ではない場合のみ上書き
                                if (lCell && lCell.v !== undefined && lCell.v !== null && !lCell.f) {
                                    const eCell = eSheet.getCell(r + 1, c + 1);
                                    eCell.value = lCell.v;
                                }
                            }
                        }
                    }
                });

                // ④ 新しいファイルとしてダウンロード
                const buffer = await wb.xlsx.writeBuffer();
                saveAs(new Blob([buffer]), "手書き済_" + originalFileName);
                
            } catch (err) {
                console.error(err);
                alert("保存エラー: " + err.message);
            } finally {
                showLoading(false);
            }
        }

        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'flex' : 'none';
        }
    </script>
</body>
</html>
