<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Excel手書き入力アプリ</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SheetJS -->
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <!-- Phosphor Icons (for UI) -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <style>
        body { font-family: 'Inter', sans-serif; }
        
        /* Table Styles for iPad Optimization */
        .excel-table {
            border-collapse: collapse;
            width: max-content;
            min-width: 100%;
        }
        .excel-table th, .excel-table td {
            border: 1px solid #d1d5db;
            padding: 1.25rem 1.5rem; /* iPad向けパディング */
            min-height: 64px; /* iPad向け最小高さ */
            height: 64px;
            font-size: 1.125rem; /* text-lg相当 */
            text-align: left;
            position: relative;
            background-color: #ffffff;
            transition: background-color 0.2s;
        }
        .excel-table th {
            background-color: #f3f4f6;
            font-weight: 600;
            color: #374151;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .excel-table td {
            cursor: pointer;
        }
        .excel-table td:hover {
            background-color: #fef08a; /* ホバー時にハイライト */
        }

        /* Canvas Styles */
        #drawingCanvas {
            background-color: #ffffff;
            border: 2px solid #e5e7eb;
            border-radius: 0.5rem;
            cursor: crosshair;
            touch-action: none; /* iPadでのスクロールを防止 */
            width: 100%;
            height: 300px;
        }

        /* Loading Spinner */
        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 3px solid #ffffff;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-100 h-screen flex flex-col overflow-hidden text-gray-800">

    <!-- Header Controls -->
    <header class="bg-white shadow-sm py-4 px-6 z-20 flex flex-wrap gap-4 items-center justify-between shrink-0">
        <div class="flex items-center gap-3">
            <div class="bg-green-100 p-2 rounded-lg text-green-600">
                <i class="ph ph-file-xls text-2xl"></i>
            </div>
            <h1 class="text-xl font-bold text-gray-800">手書きExcel入力</h1>
        </div>

        <div class="flex flex-wrap items-center gap-4">
            <!-- API Key Input -->
            <div class="flex items-center bg-gray-50 border border-gray-300 rounded-lg px-3 py-2">
                <i class="ph ph-key text-gray-500 mr-2"></i>
                <input type="password" id="apiKeyInput" placeholder="Gemini APIキー (任意)" class="bg-transparent border-none outline-none text-sm w-48 placeholder-gray-400">
            </div>

            <!-- File Upload -->
            <div>
                <input type="file" id="fileInput" accept=".xlsx, .xls" class="hidden" />
                <label for="fileInput" class="cursor-pointer bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 font-medium py-2 px-4 rounded-lg flex items-center gap-2 shadow-sm transition-colors">
                    <i class="ph ph-upload-simple"></i>
                    Excelを開く
                </label>
            </div>

            <!-- Export Button -->
            <button id="exportBtn" disabled class="bg-green-600 hover:bg-green-700 disabled:bg-gray-300 disabled:cursor-not-allowed text-white font-medium py-2 px-4 rounded-lg flex items-center gap-2 shadow-sm transition-colors">
                <i class="ph ph-download-simple"></i>
                Excelとして保存
            </button>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-grow overflow-auto p-6 relative">
        <div id="statusMessage" class="mb-4 p-4 rounded-lg bg-blue-50 text-blue-800 border border-blue-200 flex items-center gap-3">
            <i class="ph ph-info text-xl"></i>
            <span id="statusText">Excelファイルをアップロードしてください。</span>
        </div>

        <div class="bg-white rounded-lg shadow-sm overflow-auto max-h-full border border-gray-200">
            <table id="excelTable" class="excel-table hidden">
                <thead id="excelThead"></thead>
                <tbody id="excelTbody"></tbody>
            </table>
        </div>
    </main>

    <!-- Handwriting Modal -->
    <div id="handwritingModal" class="fixed inset-0 bg-gray-900/60 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl shadow-2xl p-6 w-full max-w-3xl flex flex-col gap-4">
            
            <div class="flex justify-between items-center">
                <h2 class="text-xl font-bold text-gray-800 flex items-center gap-2">
                    <i class="ph ph-pencil-line"></i> セルへ手書き入力
                </h2>
            </div>
            
            <p class="text-sm text-gray-500">枠内に文字を書き、「認識する」をタップしてください。</p>
            <p id="modalError" class="text-sm text-red-600 hidden bg-red-50 p-2 rounded"></p>

            <!-- Canvas Container -->
            <div class="w-full bg-gray-50 rounded-lg p-2 border border-gray-200">
                <canvas id="drawingCanvas"></canvas>
            </div>

            <!-- Actions -->
            <div class="flex flex-col sm:flex-row justify-between items-center gap-3 mt-4">
                <button id="clearBtn" class="w-full sm:w-auto text-gray-600 hover:text-red-600 font-medium py-3 px-6 rounded-lg border border-gray-300 hover:bg-red-50 transition-colors flex items-center justify-center gap-2 text-lg bg-white">
                    <i class="ph ph-eraser"></i> クリア
                </button>
                
                <div class="flex gap-3 w-full sm:w-auto">
                    <button id="cancelBtn" class="w-full sm:w-auto bg-gray-200 hover:bg-gray-300 text-gray-800 font-medium py-3 px-6 rounded-lg transition-colors text-lg">
                        キャンセル
                    </button>
                    <button id="recognizeBtn" class="w-full sm:w-auto bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 px-8 rounded-lg transition-colors flex items-center justify-center gap-2 shadow-sm min-w-[160px] text-lg">
                        <span id="recognizeBtnText">認識する</span>
                        <div id="recognizeSpinner" class="spinner hidden"></div>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // DOM Elements
            const fileInput = document.getElementById('fileInput');
            const exportBtn = document.getElementById('exportBtn');
            const apiKeyInput = document.getElementById('apiKeyInput');
            
            const table = document.getElementById('excelTable');
            const thead = document.getElementById('excelThead');
            const tbody = document.getElementById('excelTbody');
            const statusMessage = document.getElementById('statusMessage');
            const statusText = document.getElementById('statusText');
            
            const modal = document.getElementById('handwritingModal');
            const canvas = document.getElementById('drawingCanvas');
            const ctx = canvas.getContext('2d', { willReadFrequently: true });
            const clearBtn = document.getElementById('clearBtn');
            const cancelBtn = document.getElementById('cancelBtn');
            const recognizeBtn = document.getElementById('recognizeBtn');
            const recognizeBtnText = document.getElementById('recognizeBtnText');
            const recognizeSpinner = document.getElementById('recognizeSpinner');
            const modalError = document.getElementById('modalError');

            // State
            let activeCell = null;
            let isDrawing = false;
            let lastX = 0;
            let lastY = 0;
            let hasDrawn = false;

            // --- Helper Functions ---
            function setStatus(msg, type = 'info') {
                statusText.textContent = msg;
                statusMessage.className = `mb-4 p-4 rounded-lg flex items-center gap-3 border ${
                    type === 'error' ? 'bg-red-50 text-red-800 border-red-200' :
                    type === 'success' ? 'bg-green-50 text-green-800 border-green-200' :
                    'bg-blue-50 text-blue-800 border-blue-200'
                }`;
            }

            function setModalError(msg) {
                if (msg) {
                    modalError.textContent = msg;
                    modalError.classList.remove('hidden');
                } else {
                    modalError.classList.add('hidden');
                }
            }

            // --- Excel Handling ---
            fileInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;

                setStatus("読み込み中...", "info");
                const reader = new FileReader();
                
                reader.onload = (evt) => {
                    try {
                        const data = new Uint8Array(evt.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });
                        const firstSheetName = workbook.SheetNames[0];
                        const worksheet = workbook.Sheets[firstSheetName];
                        
                        // Convert to array of arrays
                        const jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: "" });
                        renderTable(jsonData);
                        
                        exportBtn.disabled = false;
                        table.classList.remove('hidden');
                        setStatus(`「${file.name}」を読み込みました。セルをタップして入力してください。`, "success");
                    } catch (error) {
                        console.error(error);
                        setStatus("Excelファイルの解析に失敗しました。", "error");
                    }
                };
                
                reader.readAsArrayBuffer(file);
                e.target.value = ''; // Reset input
            });

            function renderTable(data) {
                thead.innerHTML = '';
                tbody.innerHTML = '';
                
                if (data.length === 0) return;

                // Header Row
                const headerRow = data[0];
                const trHead = document.createElement('tr');
                headerRow.forEach(text => {
                    const th = document.createElement('th');
                    th.textContent = text;
                    trHead.appendChild(th);
                });
                thead.appendChild(trHead);

                // Data Rows
                for (let i = 1; i < data.length; i++) {
                    const tr = document.createElement('tr');
                    const rowData = data[i];
                    
                    for (let j = 0; j < headerRow.length; j++) {
                        const td = document.createElement('td');
                        td.textContent = rowData[j] !== undefined ? rowData[j] : "";
                        td.addEventListener('click', () => openModal(td));
                        tr.appendChild(td);
                    }
                    tbody.appendChild(tr);
                }
            }

            exportBtn.addEventListener('click', () => {
                try {
                    const wb = XLSX.utils.table_to_book(table, { sheet: "Sheet1" });
                    XLSX.writeFile(wb, 'updated_data.xlsx');
                    setStatus("ファイルを保存しました。", "success");
                } catch (error) {
                    setStatus("ファイルの保存に失敗しました。", "error");
                }
            });

            // --- Canvas & Modal Logic ---
            function initCanvas() {
                // Ensure canvas internal resolution matches display size for crisp lines
                const rect = canvas.parentElement.getBoundingClientRect();
                canvas.width = rect.width;
                canvas.height = 300; // Fixed height defined in CSS

                ctx.fillStyle = "#ffffff";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.lineWidth = 4;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.strokeStyle = '#000000';
                hasDrawn = false;
                setModalError("");
            }

            function openModal(cell) {
                activeCell = cell;
                modal.classList.remove('hidden');
                modal.classList.add('flex');
                
                // Initialize canvas after modal is displayed so it gets correct dimensions
                setTimeout(initCanvas, 10); 
            }

            function closeModal() {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
                activeCell = null;
                setLoadingState(false);
            }

            function getCoordinates(e) {
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                
                let clientX, clientY;
                if (e.touches && e.touches.length > 0) {
                    clientX = e.touches[0].clientX;
                    clientY = e.touches[0].clientY;
                } else {
                    clientX = e.clientX;
                    clientY = e.clientY;
                }

                return {
                    x: (clientX - rect.left) * scaleX,
                    y: (clientY - rect.top) * scaleY
                };
            }

            function startDrawing(e) {
                e.preventDefault();
                isDrawing = true;
                const pos = getCoordinates(e);
                lastX = pos.x;
                lastY = pos.y;
            }

            function draw(e) {
                if (!isDrawing) return;
                e.preventDefault(); // Prevent scrolling on iPad
                
                const pos = getCoordinates(e);
                
                ctx.beginPath();
                ctx.moveTo(lastX, lastY);
                ctx.lineTo(pos.x, pos.y);
                ctx.stroke();
                
                lastX = pos.x;
                lastY = pos.y;
                hasDrawn = true;
            }

            function stopDrawing(e) {
                if (e) e.preventDefault();
                isDrawing = false;
            }

            // Mouse Events
            canvas.addEventListener('mousedown', startDrawing);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseup', stopDrawing);
            canvas.addEventListener('mouseout', stopDrawing);

            // Touch Events (iPad/Apple Pencil)
            canvas.addEventListener('touchstart', startDrawing, { passive: false });
            canvas.addEventListener('touchmove', draw, { passive: false });
            canvas.addEventListener('touchend', stopDrawing, { passive: false });
            canvas.addEventListener('touchcancel', stopDrawing, { passive: false });

            clearBtn.addEventListener('click', initCanvas);
            cancelBtn.addEventListener('click', closeModal);

            // --- Gemini API Logic ---
            function setLoadingState(isLoading) {
                if (isLoading) {
                    recognizeBtn.disabled = true;
                    recognizeBtnText.textContent = "認識中...";
                    recognizeSpinner.classList.remove('hidden');
                    setModalError("");
                } else {
                    recognizeBtn.disabled = false;
                    recognizeBtnText.textContent = "認識する";
                    recognizeSpinner.classList.add('hidden');
                }
            }

            recognizeBtn.addEventListener('click', async () => {
                if (!hasDrawn) {
                    setModalError("文字が書き込まれていません。");
                    return;
                }

                setLoadingState(true);
                
                // Get API Key (Fallback to empty string if not provided so Canvas handles it)
                const apiKey = apiKeyInput.value.trim();
                const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

                try {
                    // Convert canvas to base64 jpeg
                    const base64Data = canvas.toDataURL("image/jpeg").split(',')[1];
                    const promptText = "画像に書かれている手書きの文字をテキストに変換してください。日本語または英語のみ出力し、それ以外の説明や装飾は一切含めないでください。";

                    const payload = {
                        contents: [{
                            role: "user",
                            parts: [
                                { text: promptText },
                                { inlineData: { mimeType: "image/jpeg", data: base64Data } }
                            ]
                        }]
                    };

                    const response = await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) {
                        throw new Error(`API Error: ${response.status}`);
                    }

                    const result = await response.json();
                    
                    if (result.candidates && result.candidates.length > 0) {
                        const recognizedText = result.candidates[0].content.parts[0].text.trim();
                        
                        if (activeCell) {
                            activeCell.textContent = recognizedText;
                            // Visual feedback on cell
                            activeCell.classList.add('bg-green-100');
                            setTimeout(() => activeCell.classList.remove('bg-green-100'), 1000);
                        }
                        closeModal();
                    } else {
                        throw new Error("Invalid response format");
                    }

                } catch (error) {
                    console.error("Gemini Recognition Error:", error);
                    setModalError("認識に失敗しました。APIキーが正しいか、または通信環境を確認してください。");
                } finally {
                    setLoadingState(false);
                }
            });
        });
    </script>
</body>
</html>
